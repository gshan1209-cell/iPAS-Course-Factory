name: Phase 1 Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: build-test-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Show toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase1-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

      - name: Phase 1 acceptance
        run: pnpm test:acceptance

      - name: Full test suite
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: CLI migrated-unit smoke
        run: pnpm --filter @ipas-course-factory/cli start -- status M1-02
