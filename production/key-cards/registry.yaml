    - globalProductionKey
    - templateOrVisualProfileVersion
    - sourceAnalysisSnapshotId
    - lockedEvidenceFields
    - governedTeachingContent
    - lifeExample
    - traps
    - memoryPhrase
    - relatedConcepts
    - mascotThemeRole
    - explicitVisualRevisionKey
  exclude:
    - randomImageSeed
    - chatTitle
    - conversationMemory
states:
  productionComplete: QA_PASSED
  allowed:
    - PLANNED
    - CLAIMED
    - VISUAL_READY
    - RENDERED
    - QA_PASSED
    - REVISION_REQUIRED
    - STALE_REGEN_REQUIRED
    - SUPERSEDED
    - SAMPLE_ONLY
