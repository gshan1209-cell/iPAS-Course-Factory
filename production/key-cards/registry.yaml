- SOURCE_CHANGED
- TEMPLATE_CHANGED
- CONTENT_CORRECTION
- QA_REJECTED
- USER_APPROVED_REDESIGN
- MASCOT_IDENTITY_FIX
- EVIDENCE_TEXT_FIX
- PROGRAM_PROFILE_CHANGED
