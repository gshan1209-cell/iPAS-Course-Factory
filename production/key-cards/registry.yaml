status: ACTIVE
effectiveDate: '2026-08-20'
coordinationSource: github
registryRole: cross-chat-cross-program-image-production-lock-and-audit
programRegistryRef: sources/registry/exam-programs.yaml
policyRefs:
  architecture: docs/MULTI_EXAM_FACTORY_ARCHITECTURE.md
  productionPlan: docs/KEY_CARD_IMAGE_PRODUCTION_PLAN.md
  batches: production/key-cards/batches.yaml
  template: sources/registry/key-card-template-policy.yaml
  deterministicText: docs/KEY_CARD_DETERMINISTIC_TEXT_POLICY.md
  mascot: docs/KEY_CARD_MASCOT_POLICY.md
  dynamicHeight: docs/KEY_CARD_DYNAMIC_HEIGHT_POLICY.md
namespacePolicy:
  requireProgramCodeForNewRecords: true
  globalProductionKeyFormat: '<PROGRAM>-<TRACK_OR_LEVEL>-<SUBJECT>-<TOPIC_ID>-<CARD_NO>'
  globallyUniqueKeyField: globalProductionKey
  legacyProductionKeyField: productionKey
  legacyIpasKeysRemainReadable: true
  neverMassRewriteHistoricalEvidenceIds: true
  duplicateCheckUsesGlobalProductionKey: true
claimPolicy:
  granularity: one-card
  leaseMinutes: 60
  preclaimBatch: false
  requireFreshRegistrySha: true
  staleShaMeansRefetchAndRetry: true
  allowTakeoverAfterLeaseExpiry: true
  claimMustMatchProgramCode: true
fingerprintPolicy:
  algorithm: sha256
  canonicalEncoding: utf-8-json-sorted-keys
  include:
    - programCode
    - globalProductionKey
    - templateOrVisualProfileVersion
    - sourceAnalysisSnapshotId
    - lockedEvidenceFields
    - governedTeachingContent
    - lifeExample
    - traps
    - memoryPhrase
    - relatedConcepts
    - mascotThemeRole
    - explicitVisualRevisionKey
  exclude:
    - randomImageSeed
    - chatTitle
    - conversationMemory
states:
  productionComplete: QA_PASSED
  allowed:
    - PLANNED
    - CLAIMED
    - VISUAL_READY
    - RENDERED
    - QA_PASSED
    - REVISION_REQUIRED
    - STALE_REGEN_REQUIRED
    - SUPERSEDED
    - SAMPLE_ONLY
revisionReasons:
  - SOURCE_CHANGED
  - TEMPLATE_CHANGED
  - CONTENT_CORRECTION
  - QA_REJECTED
  - USER_APPROVED_REDESIGN
  - MASCOT_IDENTITY_FIX
  - EVIDENCE_TEXT_FIX
  - PROGRAM_PROFILE_CHANGED
legacyProductionKeyFormat: '<LEVEL>-<SUBJECT>-<ATOMIC_TOPIC_ID>-<CARD_NO>'
globalProductionKeyFormat: '<PROGRAM>-<TRACK_OR_LEVEL>-<SUBJECT>-<TOPIC_ID>-<CARD_NO>'
examples:
  - IPAS-JR-S1-I1-01-C001
  - IPAS-MID-S3-M3-06-C023
  - POSTAL-<TRACK>-<SUBJECT>-<TOPIC>-C001
artifactNamePolicy:
  globalRecommendedFormat: '<PROGRAM>_<級別或類組>_<科目>_<CARD_NO>_<TOPIC_ID>_<短主題>_v<artifactRevision>.png'
  ipasLegacyCompatibleFormat: '<級別>_<科目>_<CARD_NO>_<ATOMIC_TOPIC_ID>_<短主題>_v<artifactRevision>.png'
