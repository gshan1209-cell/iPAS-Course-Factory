policyVersion: CITATION-v1.2
status: ACTIVE
effectiveFrom: '2026-08-20'
purpose: auditable-key-card-source-citation
fields:
  citationField: 出處
  sourceEvidenceField: 來源依據
  cardDisplayField: 卡面出處
layers:
  dataLayer:
    purpose: full-audit-traceability
    retainFullCitation: true
    retainOfficialUrlOrDriveMirror: true
    retainQuestionNumbers: true
    retainQuestionCount: true
    examCitation: '<完整梯次><級別><科目> Q<nn>、Q<nn>'
    officialGuideCitation: '官方學習指引：<能力指標或主題>'
    separator: '；'
  cardLayer:
    purpose: compact-readable-source-display
    showExamRate: false
    showQuestionNumbers: false
    showQuestionCount: false
    showLevelSubjectInExamList: false
    format: '指引:「<主題名稱>」；考題:<年份-梯次>、<年份-梯次>…'
    guidePrefix: '指引:'
    examPrefix: '考題:'
    useChineseCornerQuotesForGuide: true
    separator: '；'
    examSessionSeparator: '、'
    examSessionAbbreviation:
      examples:
        - '114-4'
        - '115-1'
        - '115-2'
examples:
  card:
    - '指引:「AI 治理概念」；考題:115-2'
    - '指引:「機器學習技術與應用」；考題:114-2、115-1'
    - '指引:「機器學習基本原理」；考題:114-4、115-1、115-2'
  data:
    - '官方學習指引：AI 治理概念；115年第二次初級科目一 Q5、Q6'
rules:
  cardCitationGuideFirst: true
  cardCitationExamSecond: true
  cardCitationMustBeConcise: true
  dataCitationMustRemainFull: true
  cardExamListShowsOnlySessionsWithMappedQuestions: true
  cardExamListDeduplicateSessions: true
  cardExamListSortChronologically: true
  cardExamListForbidQuestionNumbers: true
  cardExamListForbidQuestionCount: true
  cardExamListForbidLevelSubjectText: true
  allowMultipleSessions: true
  includeOfficialGuideWhenMapped: true
  forbidAmbiguousDataShorthand:
    - '114Q'
    - '115Q'
    - '115-1Q'
    - '115-2Q'
  sourceEvidenceMustRetainOfficialUrlOrDriveMirror: true
qa:
  citationRequiredForPublishedCard: true
  cardDisplayMustFollowCompactFormat: true
  crossCheckCardCitationAgainstDataCitation: true
  crossCheckEachDisplayedSessionHasTrueQuestionReference: true
  cardDisplayMustNotContainQuestionNumber: true
  cardDisplayMustNotContainQuestionCount: true
  cardDisplayMustNotContainLevelSubjectAfterExamPrefix: true
  zeroAmbiguousDataShorthandBeforePublish: true
