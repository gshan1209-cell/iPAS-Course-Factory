mascot:
  name: 小芯
  required: true
  assetTitle: iPAS_重點卡_角色素材_小芯_v1.0.png
  driveFileId: 1rknCaHazFlMqRZ1QSKmmhRJ9F8T9kHdM
  placement: top-right
  keepClearOf:
    - stars
    - card-number
    - exam-labels
    - main-title
  rule: use the governed mascot asset; do not redraw the mascot into a different identity during batch production
sizeVariants:
  widthPolicy:
    fixedWidthPx: 1024
    allowWidthChange: false
  standard:
    code: STANDARD
    widthPx: 1024
    heightPx: 1536
    useWhen: content fits while preserving canonical typography and spacing hierarchy
  extended:
    code: EXTENDED
    widthPx: 1024
    heightMode: dynamic
    minHeightPx: 1537
    preferredHeightPresetsPx: [1700, 1850, 2048]
    mayExtendBeyondPreset: true
    useWhen: content cannot fit in STANDARD after simplification without reducing typography
    preserveSectionOrder: true
    preserveTypographyScale: true
    preserveCardIdentity: true
  selectionRule: use STANDARD by default; switch to EXTENDED whenever fitting the governed content would otherwise require shrinking text below the canonical sample scale
heightAndTypographyPolicy:
  coreRule: '寧可拉高卡片，不可縮小字體。'
  typographyBaselineRef: canonicalSample
  fontScaleLocked: true
  minimumFontScaleRatioVsCanonicalSample: 1.0
  forbidFontDownscaleForFit: true
  allowHeightGrowth: true
  allowDecorativeWhitespaceTightening: true
  allowDecorativeIconResizeWithinHierarchy: true
  overflowResolutionOrder:
    - simplify-wording-without-losing-exam-meaning
    - remove-redundant-explanatory-phrases
    - tighten-nonsemantic-whitespace-within-readable-limits
    - switch-to-extended-height
    - increase-height-until-readable
    - split-into-multiple-cards-if-content-contains-more-than-one-exam-point
  splitRule:
    splitWhenMultipleExamPoints: true
    doNotUseExtremeHeightToCombineDistinctExamPoints: true
    preserveOneCardOneExamPoint: true
  prohibited:
    - shrink-body-font-to-fit
    - shrink-source-footer-below-readable-baseline
    - compress-line-height-until-text-crowds
    - remove-required-life-example-to-save-space
    - remove-required-source-citation-to-save-space
headerContract:
  topBar:
    brandText: iPAS
    levelSubjectRequired: true
    levelSubjectDisplayFormat: '<級別>-<科目>'
    examples:
      - 初級-科目一
      - 初級-科目二
      - 中級-科目一
      - 中級-科目二
      - 中級-科目三
    starRatingRequired: true
    starDisplay: large-icon-row
    starSlotCount: 5
    hideImportanceText: true
    hideKeyCardText: true
    cardNumberRequired: true
    cardNumberDisplayFormat: 'C-<nnn>'
    cardNumberScope: per-subject
    examRateVisible: false
  secondRow:
    sectionTitleRequired: true
    sectionTitleExample: 'AI 基礎概念'
    sectionTitleAlignment: left
    cardCategoryRequired: true
    examLabelsRequiredWhenApplicable: true
    doNotRepeatLevelSubject: true
layout:
  - top-header-brand-level-subject-large-stars-card-number
  - second-row-section-title-category-icon-exam-labels-and-mascot
  - exam-point-title-and-one-line-summary
  - core-points
  - life-example
  - common-traps
  - memory-phrase
  - related-concepts
  - footer-source-citation
contentRules:
  oneCardOneExamPoint: true
  simplifyContent: true
  largeTypography: true
  mobileReadableFirst: true
  lifeExampleRequired: true
  corePointCountMax: 4
  trapCountMax: 3
  relatedConceptCountMax: 3
  memoryPhraseRequired: true
  examPriorityUsesStarOnly: true
  displayExamRateOnCard: false
  retainExamRateInDataLayer: true
  footerSourceCitationRequired: true
  avoidDenseParagraphs: true
  preferShortSentences: true
  preferVisualProcessForLifeExample: true
  removeUnusedLabelPlaceholders: true
labelPlacement:
  cardCategory:
    displayMode: icon-only
    headingVisible: false
    showText: false
    showCode: false
    iconRequired: true
    policyRef: sources/registry/key-card-label-policy.yaml
  examLabels:
    headingVisible: false
    displayMode: text-badge
    showOnlyApplicable: true
    requiredWhenApplicable: true
    allowMultiple: true
    policyRef: sources/registry/key-card-label-policy.yaml
footerSourceCitation:
  policyRef: sources/registry/key-card-citation-policy.yaml
  format: '指引:「<主題名稱>」；考題:<年份-梯次> <級別科目> Q<nn>、Q<nn>'
  example: '指引:「AI 的定義與分類」；考題:115-1 初級科一 Q14、Q34、Q36、Q38；115-2 初級科一 Q1、Q3、Q4'
  guideFirst: true
  examSecond: true
  compactDisplayOnly: true
  exactTextRequired: true
renderingPolicy:
  mode: hybrid-deterministic
  visualGeneration:
    allowedFor:
      - mascot-and-illustration-assets
      - icons
      - decorative-backgrounds
      - non-text-visual-process-elements
    forbiddenFor:
      - evidence-text
      - source-footer-text
      - card-number-text
      - star-count-text-or-value
      - exam-label-text
  deterministicTextLayer:
    required: true
    rendererRole: fixed-template-or-programmatic-layout
    exactTextMode: true
    sourceOfTruth: governed-data-layer
    lockedFields:
      - level-subject
      - section-title
      - atomic-topic-title
      - star-rating
      - card-number
      - card-category-code-and-icon
      - exam-labels
      - guide-topic
      - exam-question-refs
      - source-footer
    noParaphrase: true
    noAutoCorrection: true
    noQuestionNumberInference: true
    noSourceSubstitution: true
  workflow:
    - resolve-governed-card-record
    - validate-locked-fields
    - generate-or-select-visual-assets
    - compose-fixed-layout
    - inject-deterministic-text
    - compare-rendered-locked-text-with-data-record
    - fail-on-any-mismatch
  qaGate: EVIDENCE_TEXT_LOCKED
cardIdentity:
  visibleFields:
    - brand
    - level-subject
    - section-title
    - card-category-icon
    - exam-labels
    - star-rating
    - card-number
  internalTraceabilityFields:
    - atomic-topic-id
    - source-id
    - question-uid
  rule: visible card number must never replace internal atomic/source traceability
weightPolicyRef: sources/registry/key-card-weight-policy.yaml
citationPolicyRef: sources/registry/key-card-citation-policy.yaml
changeControl:
  templateVersioning: append-only
  replaceMasterRequiresApproval: true
  neverOverwriteHistoricalTemplateEvidence: true
  updateDriveAndPolicyTogether: true
qa:
  requireFixedWidthPx: 1024
  standardVariantExactHeightPx: 1536
  extendedVariantDynamicHeight: true
  requireReadableMobileText: true
  requireVisualHierarchy: true
  requireLevelSubjectLabel: true
  requireSectionTitle: true
  requireCardNumber: true
  requireLargeStarIcons: true
  forbidImportanceText: true
  forbidKeyCardTextInHeader: true
  requireCardCategoryIcon: true
  forbidCardCategoryText: true
  requireApplicableExamLabelsOnly: true
  requireExamLabelsWhenApplicable: true
  requireMascotTopRight: true
  requireLifeExample: true
  requireSimplifiedContent: true
  forbidExamRateOnCard: true
  requireCompactSourceFooter: true
  requireExactSourceFooterText: true
  crossCheckSourceFooterAgainstDataLayer: true
  requireSampleStructureMatch: true
  forbidTypographyDownscaleForFit: true
  requireDynamicHeightWhenNeeded: true
  requireSplitWhenMultipleExamPoints: true
  requireDeterministicLockedText: true
  failOnLockedTextMismatch: true
